services:
  monitor:
    build:
      context: .
      target: app
    ports:
      - "${SERVWORX_BIND_ADDRESS:-127.0.0.1}:${SERVWORX_PORT:-7676}:5000"
    environment:
      SERVWORX_ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      CONTAINER_BROKER_URL: http://docker-broker:8080
      CONTAINER_BROKER_TOKEN_FILE: /run/secrets/container-broker-token
      SERVWORX_TRUSTED_PROXY_CIDRS: "${SERVWORX_TRUSTED_PROXY_CIDRS:-}"
      # SERVWORX_CA_BUNDLE_FILE: /app/config/ca/private-ca.pem
    secrets:
      - admin-password
      - container-broker-token
    volumes:
      - servworx-config:/app/config
    networks:
      - frontend
      - broker
    depends_on:
      docker-broker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  docker-broker:
    build:
      context: .
      target: broker
    environment:
      CONTAINER_BROKER_TOKEN_FILE: /run/secrets/container-broker-token
      SERVWORX_ALLOWED_CONTAINERS: "${SERVWORX_ALLOWED_CONTAINERS:?set a comma-separated exact container allowlist}"
    secrets:
      - container-broker-token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:?set the numeric group owning /var/run/docker.sock}"
    networks:
      - broker
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    restart: unless-stopped

secrets:
  admin-password:
    file: ./secrets/admin-password
  container-broker-token:
    file: ./secrets/container-broker-token

volumes:
  servworx-config:

networks:
  frontend:
  broker:
    internal: true
