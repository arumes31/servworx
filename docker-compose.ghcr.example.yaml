services:
  monitor:
    container_name: servworx
    # Consider pinning a specific tag (e.g. :sha-<commit>) or digest instead of :latest
    image: ghcr.io/arumes31/servworx:latest
    ports:
      - "7676:5000"
    environment:
      # --- Initial admin password (first start only; otherwise a random one is written to ./config/initial_admin_password) ---
      # - ADMIN_PASSWORD=change-this-to-a-long-secret

      # --- Reverse proxies allowed to set X-Forwarded-* (default: loopback + private ranges) ---
      # - TRUSTED_PROXIES=172.18.0.0/16

      # --- Use a Docker socket proxy instead of mounting /var/run/docker.sock ---
      # - DOCKER_HOST=tcp://docker-socket-proxy:2375

      # --- Webhook Notification ---
      # - NOTIFICATION_WEBHOOK_URL=http://your-webhook-endpoint.local/alert
      
      # --- MS Teams Webhook ---
      # - NOTIFICATION_MSTEAMS_URL=https://outlook.office.com/webhook/your-teams-endpoint
      
      # --- Telegram Bot Alerts ---
      # - NOTIFICATION_TELEGRAM_TOKEN=123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ
      # - NOTIFICATION_TELEGRAM_CHAT_ID=-100123456789
      
      # --- SMTP Email Notifications ---
      # - NOTIFICATION_SMTP_HOST=smtp.example.com
      # - NOTIFICATION_SMTP_PORT=587
      # - NOTIFICATION_SMTP_USER=sender@example.com
      # - NOTIFICATION_SMTP_PASS=yoursecretpassword
      # - NOTIFICATION_SMTP_FROM=servworx@example.com
      # - NOTIFICATION_SMTP_TO=admin@example.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config
    restart: unless-stopped

